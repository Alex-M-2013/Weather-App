   name: Deploy to Pages
   on:
     push:
       branches: [master]
   jobs:
     deploy:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Inject API key
           run: echo "const API_KEY = '${{ secrets.OPENWEATHER_KEY }}';" > config.js
         - uses: actions/upload-pages-artifact@v3
           with:
             path: .
     deploy-pages:
       needs: deploy
       runs-on: ubuntu-latest
       permissions:
         pages: write
         id-token: write
       steps:
         - uses: actions/deploy-pages@v4
